spring.application.name=secure_web_system_as_an_enterprise_risk_control
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://enterprise-risk-api}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH0_ISSUER_URI}.well-known/jwks.json
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
